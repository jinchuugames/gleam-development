name = "reservation_example"
version = "1.0.0"
description = "A PostgreSQL reservation API and a supervised expiry worker."

[dependencies]
gleam_stdlib = "== 1.0.5"
gleam_erlang = "== 1.3.0"
gleam_otp = "== 1.3.0"
gleam_http = ">= 4.5.0 and < 5.0.0"
gleam_json = "== 3.1.0"
gleam_time = "== 1.11.0"
pog = "== 4.1.0"
wisp = "== 2.2.2"
mist = "== 6.0.3"
envoy = "== 1.2.0"
simplifile = "== 2.7.0"

[dev_dependencies]
gleeunit = "== 1.11.0"

[erlang]
application_start_module = "reservation_example@application"
