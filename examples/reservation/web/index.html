<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock reservation</title>
<style>
body { max-width: 46rem; margin: 3rem auto; padding: 0 1rem; font: 18px system-ui; }
label { display: block; margin: 1rem 0; } input, button { font: inherit; }
pre { white-space: pre-wrap; background: #eee; padding: 1rem; }
</style>
<h1>Stock reservation</h1>
<p>The database starts with ten keyboards. Reservations expire after sixty seconds.</p>
<form id="form">
<label>Example API token <input id="token" type="password" required autocomplete="off"></label>
<label>Quantity <input id="quantity" type="number" min="1" max="100" value="2" required></label>
<button id="reserve">Reserve stock</button>
<button id="retry" type="button" disabled>Repeat the last request</button>
</form>
<p id="notice" role="status"></p>
<pre id="result" aria-live="polite">No reservation.</pre>
<script>
const form = document.querySelector('#form');
const result = document.querySelector('#result');
const notice = document.querySelector('#notice');
const retry = document.querySelector('#retry');
let lastRequest;
let currentKey;
let busy = false;

// snippet:browser
async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: {
      'Authorization': `Bearer ${document.querySelector('#token').value}`,
      'Content-Type': 'application/json'
    }
  });
  const body = await response.json();
  if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
  return body;
}
// end:browser

async function reserve(input) {
  if (busy) return;
  busy = true;
  notice.textContent = '';
  try {
    const reservation = await api('/api/reservations', {
      method: 'POST', body: JSON.stringify(input)
    });
    currentKey = reservation.key;
    result.textContent = JSON.stringify(reservation, null, 2);
  } catch (error) {
    notice.textContent = error.message;
  } finally {
    busy = false;
    retry.disabled = false;
  }
}
form.addEventListener('submit', event => {
  event.preventDefault();
  if (busy) return;
  lastRequest = {key: crypto.randomUUID(), sku: 'keyboard', quantity: Number(document.querySelector('#quantity').value)};
  reserve(lastRequest);
});
retry.addEventListener('click', () => reserve(lastRequest));
setInterval(async () => {
  if (!currentKey || busy) return;
  try {
    const reservation = await api(`/api/reservations/${currentKey}`);
    result.textContent = JSON.stringify(reservation, null, 2);
    notice.textContent = '';
  } catch (error) { notice.textContent = error.message; }
}, 2000);
</script>
</html>
